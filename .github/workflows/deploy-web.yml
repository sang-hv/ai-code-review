name: 🌐 Deploy Web

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Auto-deploy when the site or the config models (which drive the schema) change.
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'argus_review/**'
      - '.github/workflows/deploy-web.yml'

# Permissions required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      # Regenerate the config schema from the package so the builder never
      # drifts from the actual pydantic models.
      - name: Generate config schema
        run: |
          python3.12 -m venv .venv
          .venv/bin/pip install --quiet .
          .venv/bin/argus-review dump-schema -o web/public/schema.json

      # Requires node + pnpm available in the self-hosted runner's PATH
      # (e.g. add them to the runner start script's PATH, like python3.12).
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build site
        working-directory: web
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
