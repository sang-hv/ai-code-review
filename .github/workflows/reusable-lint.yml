name: Lint

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
        required: false

jobs:
  action:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Set up virtualenv
        run: python3.12 -m venv .venv

      - run: .venv/bin/pip install ruff
      - run: .venv/bin/ruff check argus_review
