name: Test

on:
  workflow_call:
    inputs:
      config-file:
        type: string
        default: "./argus_review/tests/configs/config-test.yaml"
        required: false
      python-version:
        type: string
        default: "3.12"
        required: false

jobs:
  action:
    runs-on: self-hosted
    container:
      image: python:${{ inputs.python-version }}-slim
    env:
      AI_REVIEW_CONFIG_FILE_YAML: ${{ inputs.config-file }}
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v6

      - name: Install dependencies
        run: pip install .[test] pytest pytest-cov

      - name: Run tests
        run: pytest --cov=argus_review --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: true
