name: 🤖 Review Self

on:
  # Auto-run on every PR open/update against this repo.
  pull_request:
    types: [ opened, synchronize, reopened ]

  # Manual run from the Actions tab (any command, any PR number).
  workflow_dispatch:
    inputs:
      review-command:
        type: choice
        default: 'run'
        options:
          - run
          - run-inline
          - run-context
          - run-summary
          - run-inline-reply
          - run-summary-reply
          - clear-inline
          - clear-summary
        required: true
        description: 'Review command'
      pull-request-number:
        type: string
        required: true
        description: 'Pull request number'

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: 🤖 review self
    uses: ./.github/workflows/reusable-review-self.yml
    with:
      review-command: ${{ inputs.review-command || 'run' }}
      pull-request-number: ${{ inputs.pull-request-number || github.event.pull_request.number }}
    secrets: inherit