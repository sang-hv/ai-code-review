name: PyPI

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
        required: false

jobs:
  action:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6

      - name: Set up virtualenv
        run: python3.12 -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/pip install build twine

      - name: Build distribution
        run: .venv/bin/python -m build

      - name: Publish to PyPI
        # --skip-existing makes re-runs idempotent: if this version was already
        # uploaded (e.g. a later pipeline stage failed and the tag was re-pushed),
        # twine skips it instead of failing with 400 "File already exists".
        run: .venv/bin/twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
