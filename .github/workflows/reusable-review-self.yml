name: Review

on:
  workflow_call:
    inputs:
      review-command:
        type: string
        default: "run"
        required: true
      pull-request-number:
        type: string
        required: true

jobs:
  action:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Dogfooding: this uses the same composite action.yml that any other
      # project would consume via `uses: sang-hv/argus-code-review@main`. Only
      # the LLM/VCS env vars below are specific to this repo's CI — nothing
      # is hardcoded inside the action itself.
      - name: Run ArgusReview
        uses: ./
        # This is an AI review, not a required check — a transient LLM/API
        # failure shouldn't fail the whole job/pipeline. Errors are still
        # visible in the step's own status and logs.
        continue-on-error: true
        with:
          review-command: ${{ inputs.review-command }}
          # Optional: set these repo secrets to switch LLM provider/model/
          # endpoint/token without editing the committed YAML. Left empty
          # by default, which falls back to the ci/review/config.yaml
          # baseline (OpenAI). Set all four to point at a different
          # provider — e.g. a self-hosted 9Router proxy:
          #   LLM_PROVIDER = 9ROUTER
          #   LLM_MODEL    = <model your 9Router combo routes to>
          #   LLM_API_URL  = http://localhost:20128/v1
          #   LLM_API_TOKEN = (leave unset if no auth required)
          llm-provider: ${{ secrets.LLM_PROVIDER }}
          llm-model: ${{ secrets.LLM_MODEL }}
          llm-api-url: ${{ secrets.LLM_API_URL }}
          llm-api-token: ${{ secrets.LLM_API_TOKEN }}
        env:
          AI_REVIEW_CONFIG_FILE_YAML: ./ci/review/config.yaml

          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ inputs.pull-request-number }}

      # Artifacts are disabled in ci/review/config.yaml (llm_enabled/
      # vcs_enabled: false) to avoid hitting GitHub's Actions storage
      # quota, so there is nothing to upload here anymore.
