name: Review

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
        required: false
      review-command:
        type: string
        default: "run"
        required: true
      pull-request-number:
        type: string
        required: true

jobs:
  action:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up virtualenv
        run: python3.12 -m venv .venv

      - name: Install ArgusReview
        run: .venv/bin/pip install .

      - name: Run ArgusReview
        env:
          AI_REVIEW_CONFIG_FILE_YAML: ./ci/review/config.yaml
          REVIEW_COMMAND: ${{ inputs.review-command }}

          # Optional overrides for ci/review/config.yaml — only take effect
          # if the corresponding secret is set. Set these repo secrets to
          # switch provider/model without editing the committed YAML.
          LLM__PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM__META__MODEL: ${{ secrets.LLM_MODEL }}

          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENAI_API_KEY }}
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          .venv/bin/argus-review show-config
          case "$REVIEW_COMMAND" in
            run|run-inline|run-context|run-summary|run-inline-reply|run-summary-reply|clear-inline|clear-summary)
              .venv/bin/argus-review "$REVIEW_COMMAND"
              ;;
            *)
              echo "Unsupported review-command: $REVIEW_COMMAND" >&2
              exit 2
              ;;
          esac

      - name: Upload ArgusReview artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: argus-review-artifacts
          path: ./artifacts
          retention-days: 7
