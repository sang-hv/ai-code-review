name: Review

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
        required: false
      review-command:
        type: string
        default: "run"
        required: true
      pull-request-number:
        type: string
        required: true

jobs:
  action:
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install ArgusReview
        run: python -m pip install .

      - name: Run ArgusReview
        env:
          AI_REVIEW_CONFIG_FILE_YAML: ./ci/review/config.yaml
          REVIEW_COMMAND: ${{ inputs.review-command }}

          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.OPENAI_API_KEY }}
          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ inputs.pull-request-number }}
        run: |
          argus-review show-config
          case "$REVIEW_COMMAND" in
            run|run-inline|run-context|run-summary|run-inline-reply|run-summary-reply|clear-inline|clear-summary)
              argus-review "$REVIEW_COMMAND"
              ;;
            *)
              echo "Unsupported review-command: $REVIEW_COMMAND" >&2
              exit 2
              ;;
          esac

      - name: Upload ArgusReview artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: argus-review-artifacts
          path: ./artifacts
          retention-days: 7

    runs-on: self-hosted
