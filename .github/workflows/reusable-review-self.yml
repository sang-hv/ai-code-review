name: Review

on:
  workflow_call:
    inputs:
      review-command:
        type: string
        default: "run"
        required: true
      pull-request-number:
        type: string
        required: true

jobs:
  action:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Dogfooding: this uses the same composite action.yml that any other
      # project would consume via `uses: sang-hv/ai-code-review@main`. Only
      # the LLM/VCS env vars below are specific to this repo's CI — nothing
      # is hardcoded inside the action itself.
      - name: Run ArgusReview
        uses: ./
        # This is an AI review, not a required check — a transient LLM/API
        # failure shouldn't fail the whole job/pipeline. Errors are still
        # visible in the step's own status and logs.
        continue-on-error: true
        with:
          review-command: ${{ inputs.review-command }}
          # Optional: set these repo secrets to switch LLM provider/model
          # without editing the committed YAML. Left empty by default,
          # which falls back to the ci/review/config.yaml baseline.
          llm-provider: ${{ secrets.LLM_PROVIDER }}
          llm-model: ${{ secrets.LLM_MODEL }}
        env:
          AI_REVIEW_CONFIG_FILE_YAML: ./ci/review/config.yaml

          # action.yml has no dedicated input for the API token or VCS
          # context, so these are passed as plain env vars instead — same
          # as any other project consuming this action would do.
          LLM__HTTP_CLIENT__API_TOKEN: ${{ secrets.LLM_API_TOKEN }}

          VCS__HTTP_CLIENT__API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VCS__PIPELINE__OWNER: ${{ github.repository_owner }}
          VCS__PIPELINE__REPO: ${{ github.event.repository.name }}
          VCS__PIPELINE__PULL_NUMBER: ${{ inputs.pull-request-number }}

      - name: Upload ArgusReview artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: argus-review-artifacts
          path: ./artifacts
          retention-days: 7
