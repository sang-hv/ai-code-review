[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argus-review"
readme = { file = "README.md", content-type = "text/markdown" }
version = "0.68.0"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Nikita Filonov", email = "nikita.filonov@gmail.com" }
]
keywords = [
    "ai",
    "code review",
    "llm",
    "openai",
    "claude",
    "gemini",
    "ollama",
    "bedrock",
    "openrouter",
    "ci/cd",
    "gitlab",
    "github",
    "gitea",
    "bitbucket",
    "bitbucket cloud",
    "bitbucket server",
    "azure",
    "azure devops",
    "azure openai"
]
maintainers = [
    { name = "Nikita Filonov", email = "nikita.filonov@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent"
]
description = "ArgusReview is an AI-powered code review tool for GitHub, GitLab, Bitbucket Cloud, Bitbucket Server, Azure DevOps and Gitea"
dependencies = [
    "typer",
    "httpx",
    "pyyaml",
    "loguru",
    "aiofiles",
    "pydantic",
    "pydantic-settings"
]
requires-python = ">=3.11"

[project.urls]
Issues = "https://github.com/deha-project/argus-review/issues"
Homepage = "https://github.com/deha-project/argus-review"
Repository = "https://github.com/deha-project/argus-review"

[project.scripts]
argus-review = "argus_review.cli.main:app"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["argus_review*"]

[tool.setuptools.package-data]
"argus_review.prompts" = ["*.md"]
"argus_review.resources" = ["*.yaml"]
