name: 'ArgusReview'
author: 'sang-hv'
branding:
  icon: 'eye'
  color: 'purple'
description: 'AI-powered code review tool'

inputs:
  review-command:
    default: 'run'
    required: false
    description: 'Which review mode to run (run, run-inline, run-summary, run-context)'
  llm-provider:
    required: false
    description: 'Override LLM provider (OPENAI, CLAUDE, GEMINI, 9ROUTER, ...). Leave empty to use the committed config.'
  llm-model:
    required: false
    description: 'Override LLM model name. Leave empty to use the committed config.'
  llm-api-url:
    required: false
    description: 'Override LLM API base URL (e.g. http://localhost:20128/v1 for 9Router). Leave empty to use the committed config.'
  llm-api-token:
    required: false
    description: 'LLM API token/key. Leave empty for token-less local gateways (e.g. 9Router with no auth).'

runs:
  using: 'composite'
  steps:
    # NOTE: actions/setup-python is intentionally not used here. On this
    # fork's self-hosted macOS runner it fails trying to write its tool
    # cache to /Users/runner (permission denied) regardless of
    # AGENT_TOOLSDIRECTORY. Python 3.12 is expected to already be
    # available on the runner (e.g. `brew install python@3.12`).
    - name: Set up virtualenv
      run: python3.12 -m venv "${{ github.action_path }}/.venv"
      shell: bash

    - name: Install ArgusReview
      run: "${{ github.action_path }}/.venv/bin/pip install --no-cache-dir \"${{ github.action_path }}\""
      shell: bash

    - name: Run ArgusReview
      env:
        REVIEW_COMMAND: ${{ inputs.review-command }}
        LLM__PROVIDER: ${{ inputs.llm-provider }}
        LLM__META__MODEL: ${{ inputs.llm-model }}
        LLM__HTTP_CLIENT__API_URL: ${{ inputs.llm-api-url }}
        LLM__HTTP_CLIENT__API_TOKEN: ${{ inputs.llm-api-token }}
      run: |
        ARGUS_REVIEW="${{ github.action_path }}/.venv/bin/argus-review"
        "$ARGUS_REVIEW" show-config
        case "$REVIEW_COMMAND" in
          run|run-inline|run-context|run-summary|run-inline-reply|run-summary-reply|clear-inline|clear-summary)
            "$ARGUS_REVIEW" "$REVIEW_COMMAND"
            ;;
          *)
            echo "Unsupported review-command: $REVIEW_COMMAND" >&2
            exit 2
            ;;
        esac
      shell: bash
